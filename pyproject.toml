[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "educational-video-studio"
version = "0.1.0"
description = "Local-first educational video studio foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.1",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "redis==5.2.1",
  "rq==2.3.3",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
